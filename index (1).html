<title>ATHAR أثر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:move;cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-tooltip{position:absolute;padding:6px;background:#fff;border:1px solid #fff;border-radius:3px;color:#222;white-space:nowrap;user-select:none;pointer-events:none}
.leaflet-tooltip.leaflet-interactive{cursor:pointer;pointer-events:auto}
.leaflet-fade-anim .leaflet-tooltip{opacity:1;transition:opacity .2s linear}
.leaflet-div-icon{background:transparent;border:0}

/* Layout concept: dark bordeaux sidebar rail on the right (RTL), parchment atlas plate as the stage.
   Map fills the stage; destination pages open as chapters on paper with a footer. */
@font-face{font-family:'XB Shafigh';src:local('XB Shafigh'),local('XBShafigh');font-display:swap}
:root{
  --jasmine:#eecf6d;--bronze:#d5ac4e;--earth:#8b6220;--lava:#720e07;--bordeaux:#45050c;
  --paper:#f6efdc;--paper-2:#ece1c2;--paper-3:#e2d3ac;--ink:#2b1812;--ink-2:#5b4637;--line:#d6c597;
  --water:#b8c8c1;--water-line:#6f8b87;
  --font-ar:'XB Shafigh','Amiri','Noto Naskh Arabic','Times New Roman',serif;
  --font-body:'XB Shafigh','Noto Naskh Arabic','Amiri','Times New Roman',serif;
  --font-en:'Times New Roman','Liberation Serif',Times,serif;
  --side-w:248px;--side-w-c:64px;--gut:clamp(20px,4vw,56px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.85;direction:rtl;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--lava);outline-offset:3px}
.side :focus-visible,.foot :focus-visible,.modal-card :focus-visible{outline-color:var(--jasmine)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:flex;height:100%;position:relative;overflow:hidden}
.stage{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
.stage.is-map{overflow:hidden}

/* ---------- sidebar ---------- */
.side{width:var(--side-w);flex:none;background:var(--bordeaux);color:var(--paper);display:flex;flex-direction:column;border-inline-start:1px solid var(--earth);transition:width .28s var(--ease);position:relative;z-index:30;overflow:hidden}
.shell.collapsed .side{width:var(--side-w-c)}
.logo-box{display:block;margin:18px 18px 8px;border:1px solid var(--earth);background:#400306;line-height:0;transition:opacity .2s}
.logo-box img{display:block;width:100%;height:auto}
.shell.collapsed .logo-box{display:none}
.side-nav{display:flex;flex-direction:column;margin-top:14px;flex:1}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;height:54px;padding:0 22px;background:none;border:0;border-inline-start:3px solid transparent;color:var(--paper);text-decoration:none;font-size:17px;text-align:start;white-space:nowrap;transition:background .2s,color .2s}
.nav-item svg{width:22px;height:22px;flex:none;color:var(--bronze);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square}
.nav-item:hover{background:rgba(238,207,109,.09)}
.nav-item.active{background:rgba(238,207,109,.14);border-inline-start-color:var(--jasmine);color:var(--jasmine)}
.nav-item.active svg{color:var(--jasmine)}
.shell.collapsed .nav-item{padding:0;justify-content:center}
.shell.collapsed .nav-item span{display:none}
.side-foot{border-top:1px solid rgba(213,172,78,.25);display:flex}
.collapse-btn{flex:1;height:52px;background:none;border:0;color:var(--bronze);display:flex;align-items:center;gap:12px;padding:0 22px;font-size:15px;white-space:nowrap}
.collapse-btn:hover{color:var(--jasmine)}
.collapse-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .28s var(--ease);flex:none}
.shell.collapsed .collapse-btn{justify-content:center;padding:0}
.shell.collapsed .collapse-btn span{display:none}
.shell.collapsed .collapse-btn svg{transform:rotate(180deg)}
.drawer-close{display:none}
.menu-btn{display:none}
.scrim{display:none}

/* ---------- map view ---------- */
.view-map{position:absolute;inset:0;background:#e6dcc0}
#map{position:absolute;inset:0;direction:ltr;background:#e9dfc3;font-family:var(--font-body)}
.mc{position:absolute;z-index:500;display:flex;flex-direction:column;border:1px solid var(--earth);background:var(--paper)}
.mc-tl{left:16px;top:16px}
.mc button{width:42px;height:42px;background:var(--paper);border:0;border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--bordeaux);transition:background .2s,color .2s}
.mc button:last-child{border-bottom:0}
.mc button:hover{background:var(--bordeaux);color:var(--jasmine)}
.mc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
.plate{position:absolute;z-index:500;top:16px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--earth);padding:5px 18px;font-size:15px;line-height:1.5;color:var(--bordeaux);white-space:nowrap;pointer-events:none}
.plate b{font-weight:700}
.plate .en{font-size:14px;color:var(--earth);margin-inline-start:10px}
.legend{position:absolute;z-index:500;right:16px;bottom:16px;background:var(--paper);border:1px solid var(--earth);padding:10px 14px 12px;min-width:196px;font-size:14px;line-height:1.5}
.legend h3{font-size:14px;font-weight:700;color:var(--earth);margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.legend li{display:flex;align-items:center;gap:10px;padding:2px 0}
.lg-d{width:22px;height:22px;display:grid;place-items:center;flex:none}
.lg-d i{width:14px;height:14px;transform:rotate(45deg);background:var(--bordeaux);border:1.5px solid var(--bronze);display:block}
.scale{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.scale-bar{height:6px;border:1.5px solid var(--bordeaux);border-top:0;width:60px}
.compass{position:absolute;z-index:500;left:16px;bottom:84px;width:64px;height:64px;pointer-events:none}
.peek{position:absolute;z-index:600;left:76px;right:16px;bottom:16px;max-width:440px;margin-inline:auto;background:var(--paper);border:1px solid var(--earth);padding:14px 16px;display:none;gap:14px;align-items:center}
.peek.on{display:flex}
.peek-t{flex:1;min-width:0}
.peek-t b{display:block;font-size:20px;line-height:1.4}
.peek-t small{color:var(--earth);font-size:14px}

/* markers */
.mk{width:34px;height:34px;position:relative;display:grid;place-items:center;cursor:pointer;outline:none}
.mk-d{position:absolute;width:23px;height:23px;background:var(--bordeaux);border:1.5px solid var(--bronze);transform:rotate(45deg);transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .2s;box-shadow:0 1px 0 rgba(69,5,12,.35)}
.mk svg{position:relative;width:15px;height:15px;color:var(--jasmine);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:miter;stroke-linecap:square;transition:color .2s}
.mk-n{position:relative;font-family:var(--font-en);font-size:15px;font-weight:700;color:var(--jasmine);line-height:1}
.mk:hover .mk-d,.mk:focus-visible .mk-d{transform:rotate(45deg) scale(1.16);background:var(--lava)}
.mk:focus-visible .mk-d{box-shadow:0 0 0 3px var(--jasmine)}
.mk.sel .mk-d{background:var(--jasmine);border-color:var(--lava);transform:rotate(45deg) scale(1.2);box-shadow:0 0 0 4px rgba(114,14,7,.28)}
.mk.sel svg{color:var(--lava)}
.mk.cl .mk-d{width:27px;height:27px;background:var(--lava);border-color:var(--jasmine)}
.leaflet-tooltip.mk-tip{background:var(--bordeaux);color:var(--jasmine);border:1px solid var(--bronze);border-radius:0;padding:5px 12px;font-family:var(--font-body);font-size:16px;line-height:1.4;box-shadow:none;direction:rtl}
.mk-tip .en{display:block;font-size:12px;color:var(--paper);opacity:.8;text-align:center}
.mk-tip::before{display:none}
.lb{white-space:nowrap;pointer-events:none;color:var(--ink-2);text-shadow:0 0 3px #efe5c8,0 0 3px #efe5c8,0 0 3px #efe5c8;line-height:1;direction:rtl;transform:translate(-50%,-50%)}
.lb-country{font-size:20px;letter-spacing:0;color:#8f7b58;font-weight:700}
.lb-jo{font-size:44px;color:var(--bordeaux);font-weight:700;opacity:.92;text-shadow:0 0 6px rgba(246,239,220,.9)}
.lb-jo small{display:block;font-family:var(--font-en);font-size:15px;letter-spacing:.42em;color:var(--earth);text-align:center;margin-top:6px;font-weight:400}
.lb-water{font-size:17px;font-style:italic;color:#4f6e6a;text-shadow:none}
.lb-feat{font-size:15px;color:var(--earth);font-style:italic}
.lb-city{font-size:14px;color:var(--ink);text-align:start;transform:translate(8px,-50%)}
.lb-city::before{content:"";position:absolute;right:calc(100% + 3px);top:50%;width:6px;height:6px;margin-top:-3px;border:1.5px solid var(--ink);background:var(--paper)}
.nofeat .lb-feat,.nofeat .lb-city{display:none}
.map-note{position:absolute;z-index:490;left:50%;bottom:6px;transform:translateX(-50%);font-size:12px;color:var(--ink-2);background:rgba(246,239,220,.85);padding:1px 10px;white-space:nowrap;pointer-events:none}

/* ---------- help ---------- */
.help-btn{position:fixed;z-index:900;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--bordeaux);border:2px solid var(--bronze);color:var(--jasmine);font-family:var(--font-en);font-size:24px;font-weight:700;line-height:1;display:grid;place-items:center;transition:background .2s,transform .2s}
.help-btn:hover{background:var(--lava);transform:scale(1.06)}
.help-btn[aria-expanded="true"]{background:var(--jasmine);color:var(--bordeaux);border-color:var(--lava)}
.help-panel{position:fixed;z-index:910;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));max-height:calc(100% - 120px);overflow:auto;background:var(--paper);border:1px solid var(--earth);box-shadow:6px 6px 0 rgba(69,5,12,.18);padding:18px 20px 20px}
.help-panel h2{font-size:22px;line-height:1.4;margin-bottom:10px;padding-inline-end:36px;color:var(--bordeaux)}
.help-x{position:absolute;top:10px;inset-inline-end:10px;width:34px;height:34px;background:none;border:1px solid var(--line);display:grid;place-items:center;color:var(--bordeaux)}
.help-x:hover{background:var(--bordeaux);color:var(--jasmine)}
.help-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.help-steps{counter-reset:s;display:grid;gap:12px}
.help-steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:16px;line-height:1.7}
.help-steps li::before{content:counter(s);font-family:var(--font-en);font-weight:700;width:28px;height:28px;display:grid;place-items:center;background:var(--bordeaux);color:var(--jasmine);font-size:15px}
.help-steps b{display:block;color:var(--lava)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:2200;background:rgba(43,24,18,.62);display:grid;place-items:center;padding:20px}
.modal-card{position:relative;width:min(440px,100%);background:var(--bordeaux);color:var(--paper);border:1px solid var(--bronze);padding:30px 30px 28px}
.modal-card .help-x{color:var(--jasmine);border-color:rgba(213,172,78,.5)}
.modal-card .help-x:hover{background:var(--jasmine);color:var(--bordeaux)}
.modal-card h2{font-size:28px;color:var(--jasmine);line-height:1.4}
.modal-card p.sub{font-size:15px;color:#e7d9b4;margin:4px 0 18px;line-height:1.7}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:15px;color:var(--jasmine)}
.field input{height:48px;padding:0 14px;background:var(--paper);border:1px solid var(--bronze);color:var(--ink);font-size:17px;width:100%}
.field input[type=email]{direction:ltr;text-align:right}
.field input:focus{outline:2px solid var(--jasmine);outline-offset:2px}
.form-msg{min-height:28px;font-size:15px;color:var(--jasmine);margin-bottom:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid var(--lava);background:var(--lava);color:var(--paper);font-size:17px;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--bordeaux);border-color:var(--bordeaux)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.btn-ghost{background:transparent;color:var(--bordeaux);border-color:var(--bordeaux)}
.btn-ghost:hover{background:var(--bordeaux);color:var(--jasmine)}
.btn-gold{background:var(--jasmine);border-color:var(--jasmine);color:var(--bordeaux);font-weight:700}
.btn-gold:hover{background:var(--bronze);border-color:var(--bronze)}
.btn-block{width:100%}

/* ---------- pages ---------- */
.page{min-height:100%;display:flex;flex-direction:column;animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page main,.page .grow{flex:1}
.wrap{padding-inline:var(--gut);max-width:1320px;margin-inline:auto;width:100%}
.crumbs{font-size:15px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;line-height:1.5}
.crumbs a{color:var(--earth);text-underline-offset:4px}
.crumbs a:hover{color:var(--lava)}
.crumbs i{font-style:normal;color:var(--bronze)}
.crumbs [aria-current]{color:var(--ink);font-weight:700}

.d-hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:min(78vh,720px);border-bottom:1px solid var(--earth)}
.d-head{padding:36px var(--gut) 40px;display:flex;flex-direction:column;gap:18px;justify-content:space-between}
.chap{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--earth);border-top:2px solid var(--earth);padding-top:10px;margin-top:6px}
.chap b{font-family:var(--font-en);font-size:17px}
.d-title{font-size:clamp(3.4rem,8.4vw,7.2rem);line-height:1.12;font-weight:700;color:var(--bordeaux);font-family:var(--font-ar);text-wrap:balance}
.d-en{font-family:var(--font-en);direction:ltr;text-align:start;font-size:clamp(1.4rem,2.6vw,2.2rem);color:var(--earth);font-style:italic;line-height:1.2;margin-top:-6px}
.d-intro{font-size:clamp(1.15rem,1.7vw,1.4rem);line-height:1.95;max-width:34em;color:var(--ink)}
.d-actions{display:flex;gap:12px;flex-wrap:wrap}
.d-art{position:relative;min-height:340px;background:var(--bordeaux);overflow:hidden}
.d-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.art-tag{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(246,239,220,.92);color:var(--ink-2);font-size:12px;line-height:1.4;padding:2px 10px;border:1px solid var(--earth)}

.d-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(32px,6vw,88px);padding-block:clamp(48px,7vw,96px)}
h2.sec{font-size:clamp(1.9rem,3.2vw,2.6rem);line-height:1.3;color:var(--bordeaux);font-family:var(--font-ar);margin-bottom:18px;display:flex;align-items:center;gap:14px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.d-about p{font-size:19px;line-height:2.05;margin-bottom:16px;max-width:38em}
.d-about p:first-of-type::first-letter{font-size:1.6em;color:var(--lava);font-weight:700}
.d-facts{background:var(--paper-2);border:1px solid var(--earth);padding:24px 24px 26px;align-self:start}
.d-facts h2.sec{font-size:1.6rem;margin-bottom:12px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.65}
.facts dt{color:var(--earth);font-weight:700}
.facts dd{min-width:0}
.facts .todo{color:var(--ink-2);font-style:italic}
.locator{margin-top:18px;border:1px solid var(--earth);background:#efe5c8}
.locator svg{display:block;width:100%;height:auto}
.locator small{display:block;padding:5px 10px;font-size:13px;border-top:1px solid var(--line);color:var(--ink-2)}
.d-explore{background:var(--paper-2);border-block:1px solid var(--line);padding-block:clamp(44px,6vw,84px)}
.ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:26px}
.ex{border-top:3px solid var(--lava);padding-top:16px}
.ex h3{font-size:1.45rem;line-height:1.45;color:var(--bordeaux);margin-bottom:8px;font-family:var(--font-ar)}
.ex p{font-size:17px;line-height:1.9;color:var(--ink)}
.d-related{padding-block:clamp(44px,6vw,84px)}
.rel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.4vw,32px);margin-top:26px}
.rel{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--earth);background:var(--paper);transition:transform .25s var(--ease),border-color .2s}
.rel:hover{transform:translateY(-4px);border-color:var(--lava)}
.rel-art{position:relative;aspect-ratio:16/10;background:var(--bordeaux);overflow:hidden;border-bottom:1px solid var(--earth)}
.rel-art svg{position:absolute;inset:0;width:100%;height:100%}
.rel-t{padding:14px 16px 16px;display:grid;gap:2px}
.rel-t b{font-size:1.5rem;line-height:1.4;color:var(--bordeaux);font-family:var(--font-ar)}
.rel-t .en{font-size:1.05rem;color:var(--earth);font-style:italic}
.rel-t small{font-size:14px;color:var(--ink-2);margin-top:6px;display:block}

/* about */
.a-hero{padding-block:clamp(40px,6vw,88px) clamp(36px,5vw,64px);border-bottom:1px solid var(--earth);display:grid;gap:28px}
.a-hero h1{font-size:clamp(2.6rem,6.6vw,5.6rem);line-height:1.3;color:var(--bordeaux);font-family:var(--font-ar);max-width:13em;text-wrap:balance}
.a-hero h1 em{font-style:normal;color:var(--lava)}
.a-hero p.lead{font-size:clamp(1.2rem,1.9vw,1.55rem);line-height:2;max-width:36em}
.a-art{position:relative;height:clamp(220px,34vw,420px);background:var(--bordeaux);border-block:1px solid var(--earth);overflow:hidden}
.a-art svg{position:absolute;inset:0;width:100%;height:100%}
.a-sec{padding-block:clamp(44px,6vw,88px)}
.a-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--earth)}
.a-two>div{padding:clamp(24px,3.4vw,44px)}
.a-two>div:first-child{background:var(--bordeaux);color:var(--paper)}
.a-two h3{font-size:2rem;font-family:var(--font-ar);margin-bottom:10px;line-height:1.3}
.a-two>div:first-child h3{color:var(--jasmine)}
.a-two>div:last-child h3{color:var(--lava)}
.a-two p{font-size:18px;line-height:2}
.a-two>div:last-child{background:var(--paper-2)}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:26px}
.pil{border-top:3px solid var(--lava);padding-top:14px}
.pil h3{font-size:1.5rem;color:var(--bordeaux);line-height:1.45;margin-bottom:6px;font-family:var(--font-ar)}
.pil p{font-size:17px;line-height:1.95}
.a-how{background:var(--paper-2);border-block:1px solid var(--line)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,40px);margin-top:26px;counter-reset:h}
.how li{counter-increment:h;font-size:17px;line-height:1.9;padding-top:14px;border-top:1px solid var(--earth);position:relative}
.how li::before{content:counter(h);font-family:var(--font-en);font-weight:700;font-size:1.6rem;color:var(--lava);display:block;line-height:1.3}
.how b{display:block;font-size:1.25rem;color:var(--bordeaux)}
.ph{margin-top:26px;border:2px dashed var(--earth);padding:20px 24px;background:var(--paper);display:grid;gap:4px}
.ph b{color:var(--earth)}
.ph p{font-size:16px;color:var(--ink-2);line-height:1.8}

/* footer */
.foot{background:var(--bordeaux);color:var(--paper);margin-top:auto;border-top:4px solid var(--bronze)}
.foot-in{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding-block:44px 34px;align-items:start}
.foot .logo-box{margin:0}
.foot p{font-size:16px;line-height:1.9;color:#eadcb9}
.foot h3{font-size:16px;color:var(--jasmine);margin-bottom:10px;border-bottom:1px solid rgba(213,172,78,.35);padding-bottom:6px}
.foot ul{display:grid;gap:6px}
.foot li a{text-decoration:none;color:var(--paper);font-size:16px}
.foot li a:hover{color:var(--jasmine);text-decoration:underline;text-underline-offset:5px}
.foot .todo{color:#d9c895;font-size:15px;font-style:italic}
.foot-b{border-top:1px solid rgba(213,172,78,.25);padding-block:14px;font-size:14px;color:#d9c895;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot-b .en{font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .foot-in{grid-template-columns:minmax(0,200px) 1fr 1fr}
  .foot-in>div:nth-child(2){grid-column:2 / -1}
}
@media (max-width:980px){
  .d-hero{grid-template-columns:1fr;min-height:0}
  .d-art{order:-1;min-height:min(56vw,420px)}
  .d-body{grid-template-columns:1fr}
  .ex-grid,.rel-grid,.pillars,.how{grid-template-columns:1fr}
  .rel{flex-direction:row}
  .rel-art{width:42%;aspect-ratio:auto;min-height:130px;border-bottom:0;border-inline-end:1px solid var(--earth);flex:none}
  .a-two{grid-template-columns:1fr}
}
@media (max-width:860px){
  .side{position:fixed;top:0;bottom:0;right:0;width:min(300px,86vw)!important;transform:translateX(100%);transition:transform .3s var(--ease);z-index:2100;padding-top:env(safe-area-inset-top,0px)}
  .shell.open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:2050;background:rgba(43,24,18,.55);opacity:0;pointer-events:none;transition:opacity .3s}
  .shell.open .scrim{opacity:1;pointer-events:auto}
  .side-foot{display:none}
  .drawer-close{display:grid;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:10px;width:36px;height:36px;background:none;border:1px solid rgba(213,172,78,.5);color:var(--jasmine);place-items:center}
  .drawer-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
  .logo-box{margin-top:54px}
  .shell.collapsed .logo-box{display:block}
  .shell.collapsed .nav-item{padding:0 22px;justify-content:flex-start}
  .shell.collapsed .nav-item span{display:inline}
  .menu-btn{display:grid;position:fixed;z-index:700;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;background:var(--bordeaux);border:1px solid var(--bronze);color:var(--jasmine);place-items:center}
  .menu-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
  .mc-tl{top:calc(14px + env(safe-area-inset-top,0px));left:14px}
  .plate{display:none}
  .legend{display:none}
  .compass{display:none}
  .map-note{display:none}
  .crumbs{padding-inline-end:56px}
  .page .wrap.top-pad{padding-top:64px}
  .d-head .crumbs{padding-top:54px}
  .a-hero{padding-top:84px}
  .foot-in{grid-template-columns:1fr 1fr}
  .foot-in>div:first-child{grid-column:1 / -1;max-width:220px}
  .foot-in>div:nth-child(2){grid-column:1 / -1}
}
@media (max-width:520px){
  body{font-size:16px}
  .facts div{grid-template-columns:104px 1fr}
  .foot-in{grid-template-columns:1fr}
  .rel{flex-direction:column}
  .rel-art{width:100%;aspect-ratio:16/10;border-inline-end:0;border-bottom:1px solid var(--earth)}
  .d-actions .btn{width:100%}
  .help-btn{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- language gate + English (LTR) mode ---------- */
.gate{position:fixed;inset:0;z-index:3000;background:var(--bordeaux);display:grid;place-items:center;padding:24px;overflow:auto}
.gate-in{width:min(420px,100%);display:grid;gap:22px;justify-items:center;text-align:center}
.gate .logo-box{margin:0;width:min(300px,78%)}
.gate-t{display:grid;gap:4px;font-size:26px;line-height:1.5;color:var(--jasmine);font-weight:700}
.gate-t .en{font-size:22px;color:var(--paper);font-weight:400}
.gate-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;direction:ltr}
.gate-btns .btn{min-height:56px;font-size:20px;width:100%}
#g-en{font-family:var(--font-en)}
.btn-ghost-light{background:transparent;color:var(--paper);border-color:var(--bronze)}
.btn-ghost-light:hover{background:var(--jasmine);color:var(--bordeaux);border-color:var(--jasmine)}
.gate-note{font-size:15px;color:#d9c895;line-height:1.7}
.ar-s{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-style:normal}
.d-en.ar-s{direction:rtl;text-align:left;font-style:normal}
.mk-tip .ar-s{font-size:14px;color:var(--paper);opacity:.85;text-align:center;display:block}
.nav-item svg.g{stroke-width:1.6}
html[lang=en] body{direction:ltr;font-family:var(--font-en);font-size:18px}
html[lang=en] :is(.d-title,h2.sec,.ex h3,.rel-t b,.a-hero h1,.a-two h3,.pil h3,.gate-t){font-family:var(--font-en)}
html[lang=en] .d-intro,html[lang=en] .d-about p{line-height:1.7}
html[lang=en] .d-title{font-size:clamp(3rem,7.4vw,6.2rem);line-height:1.04}
html[lang=en] .a-hero h1{line-height:1.12}
html[lang=en] .side{border-inline-start:0;border-inline-end:1px solid var(--earth)}
html[lang=en] .collapse-btn svg{transform:rotate(180deg)}
html[lang=en] .shell.collapsed .collapse-btn svg{transform:none}
html[lang=en] .lb{direction:ltr}
html[lang=en] .lb-country{letter-spacing:.12em;font-size:16px}
html[lang=en] .leaflet-tooltip.mk-tip{direction:ltr;font-family:var(--font-en)}
html[lang=en] .field input[type=email]{text-align:left}
html[lang=en] .lb-city::before{right:auto;left:calc(100% + 3px)}
html[lang=en] .lb-city{transform:translate(-8px,-50%)}
@media (max-width:860px){
  .crumbs{padding-inline-end:0;padding-right:56px}
  html[lang=en] .side{border-inline-end:0}
}

#app{height:100%}

 about:['كانت جدارا مركزًا ثقافيًا مزدهرًا في العصرين الهلنستي والروماني، واشتهرت بفلاسفتها وشعرائها. وتميّز عمرانها بالحجر البازلتي الأسود الذي بُنيت به أعمدتها ومبانيها.','وفي العهد العثماني قامت فوق الأطلال قرية صغيرة، ولا يزال بعض بيوتها الحجرية قائمًا بين الآثار، ما يجعل الزائر يمشي في طبقتين من الزمن في آن واحد.'],

{id:'jerash',ar:'جرش',en:'Jerash',region:'north',cat:'arch',art:'columns',ll:[32.2808,35.8993],gov:'محافظة جرش',near:'على بعد نحو 50 كم شمال عمّان',

 about:['ازدهرت جرش كواحدة من مدن الديكابوليس، وبلغ عمرانها ذروته في القرنين الثاني والثالث الميلاديين. وتتجاور فيها المعابد الرومانية والكنائس البيزنطية في موقع واحد يروي تعاقب الحضارات.','دفنت الرمال أجزاء من المدينة قرونًا طويلة فحفظتها، ثم كشفت أعمال التنقيب الحديثة عن شبكة شوارع وساحات تكاد تكون كاملة.'],

{id:'ajloun',ar:'قلعة عجلون',en:'Ajloun Castle',region:'north',cat:'castle',art:'castle',ll:[32.3256,35.7289],gov:'محافظة عجلون',near:'على قمة جبل عوف، وسط مرتفعات عجلون',

{id:'pella',ar:'طبقة فحل',en:'Pella (Tabaqat Fahl)',region:'north',cat:'arch',art:'columns',ll:[32.4486,35.617],gov:'محافظة إربد',near:'عند سفح المرتفعات المطلة على غور الأردن',

{id:'yarmouk',ar:'محمية غابات اليرموك',en:'Yarmouk Forest Reserve',region:'north',cat:'reserve',art:'forest',ll:[32.62,35.73],approx:true,gov:'محافظة إربد',near:'المنحدرات المطلة على نهر اليرموك',

 about:['اتخذ العمونيون هذا الجبل مركزًا لعاصمتهم ربّة عمّون، وبقي مأهولًا عبر العصور. وفي القرن الثاني الميلادي أُقيم عليه معبد هرقل، ثم شُيّد فيه المجمع الأموي بقصره وبوابته.','من هذه القمة تنتشر عمّان بجبالها وأحيائها، ويمكن قراءة تاريخ المدينة في طبقاتها المتعاقبة.'],
 explore:[['معبد هرقل','أعمدة ضخمة بقيت من معبد روماني من القرن الثاني الميلادي.'],['القصر الأموي','مجمع إداري من العصر الأموي ببوابته وقاعاته المقبّبة.'],['المتحف الأثري','المتحف الأثري الأردني، ويعرض مقتنيات من عصور متعددة.']],

{id:'theatre',ar:'المدرج الروماني',en:'Roman Theatre, Amman',region:'central',cat:'arch',art:'theatre',ll:[31.9516,35.9393],gov:'العاصمة عمّان',near:'وسط البلد، قرب ساحة الهاشمية',
 intro:'مدرج روماني محفور في سفح الجبل، يتوسط قلب عمّان القديمة.',
 about:['شُيّد المدرج في القرن الثاني الميلادي في عهد الإمبراطور أنطونينوس بيوس، ويتسع لنحو ستة آلاف متفرج. وحُفر في المنحدر بحيث يتجه نحو الشمال ليخفف حرارة الشمس عن الجمهور.','ما يزال المكان حيًا بالمناسبات والعروض، ويجاوره الأوديون الصغير وساحة الهاشمية.'],
 explore:[['المقاعد المتدرجة','مدرجات حجرية تنحدر في تناسق مهيب نحو خشبة المسرح.'],['متحفا الفلكلور والتقاليد','متحفان صغيران داخل المدرج يعرضان الحياة التقليدية.'],['الأوديون وساحة الهاشمية','مسرح صغير مجاور وساحة تجمع أهل المدينة.']],

{id:'madaba',ar:'مادبا',en:'Madaba',region:'central',cat:'cultural',art:'mosaic',ll:[31.716,35.7939],gov:'محافظة مادبا',near:'على بعد نحو 30 كم جنوب غرب عمّان',
 intro:'مدينة الفسيفساء، حيث تحفظ الكنائس والأرضيات خرائط وقصصًا من العصر البيزنطي.',
 about:['اشتهرت مادبا بفسيفساء كنائسها وبيوتها القديمة، وفي كنيسة القديس جاورجيوس للروم الأرثوذكس تُحفظ خريطة مادبا الفسيفسائية التي تعود إلى العصر البيزنطي.','ويمتزج في مادبا الإرث المسيحي والإسلامي، وتحتضن مدارس ومتاحف وورش حِرف تحافظ على فن الفسيفساء.'],

{id:'nebo',ar:'جبل نيبو',en:'Mount Nebo',region:'central',cat:'cultural',art:'dome',ll:[31.7679,35.7259],gov:'محافظة مادبا',near:'غرب مادبا، مشرفًا على وادي الأردن',
 intro:'قمة مقدسة أطلّ منها النبي موسى، كما تروي التقاليد، على الأرض الموعودة.',
 about:['يرتفع جبل نيبو فوق الغور والبحر الميت، وتُقدَّس قمته في التقاليد الدينية. وتقوم عليه كنيسة تذكارية بيزنطية بأرضيات فسيفسائية تحميها الرهبنة الفرنسيسكانية.','في الأيام الصافية تمتد الرؤية عبر الوادي إلى البحر الميت وأفق فلسطين.'],

{id:'dead-sea',ar:'البحر الميت',en:'The Dead Sea',region:'central',cat:'nature',art:'sea',ll:[31.55,35.6],approx:true,gov:'محافظتا البلقاء ومادبا',near:'الشاطئ الشرقي، أخفض بقعة على اليابسة',
 intro:'أخفض مكان على سطح الأرض، ببحيرة شديدة الملوحة تحملك فوق مائها.',
 about:['يقع البحر الميت على أكثر من 430 مترًا تحت مستوى سطح البحر، وتبلغ ملوحة مائه أضعاف ملوحة البحار المعتادة، فيطفو الإنسان عليه بسهولة. ويُعرف طينه ومعادنه باستخدامات العناية والاستشفاء.','ويتراجع منسوب البحر عامًا بعد عام، ما يجعل زيارته فرصة للتأمل في هشاشة هذا المشهد الفريد.'],

{id:'iraq-al-amir',ar:'عراق الأمير',en:'Iraq al-Amir',region:'central',cat:'arch',art:'blocks',ll:[31.909,35.759],gov:'محافظة عمّان',near:'وادي السير، غرب عمّان',
 intro:'قصر العبد الهلنستي بكتل حجرية ضخمة ونحوت أسود، في وادٍ أخضر غرب عمّان.',
 about:['شُيّد القصر، المعروف بقصر العبد، في القرن الثاني قبل الميلاد على يد عائلة طوبيا، ويُعد من أبرز الأبنية الهلنستية في المنطقة. وتتميز جدرانه بكتل كلسية هائلة ونحت أسود.','تحيط بالقصر أراضٍ زراعية وكهوف ووادٍ يجعل الزيارة إلى جانب التاريخ نزهة في الطبيعة.'],
 explore:[['قصر العبد','مبنى هلنستي مهيب بحجارته الضخمة.'],['نحت الأسود','تماثيل حيوانية منحوتة في الجدران.'],['وادي السير','وادٍ مخضر تتجه فيه الينابيع والمزارع.']],

{id:'mujib',ar:'وادي الموجب',en:'Wadi Mujib',region:'central',cat:'reserve',art:'canyon',ll:[31.445,35.6],approx:true,gov:'محافظتا مادبا والكرك',near:'يصبّ في البحر الميت',
 intro:'محمية وادٍ عميق من أخفض المحميات في العالم، تنحدر مسالكه المائية نحو البحر الميت.',
 about:['ينحدر وادي الموجب من مرتفعات تفوق ألف متر حتى يصل إلى مستوى البحر الميت تحت سطح البحر. وتحمي المحمية تنوعًا نباتيًا وحيويًا ضمن جدرانه الصخرية الحمراء.','تُنظَّم فيه مسارات سير مائية موسمية، وتُعلن مواعيدها وشروطها عبر إدارة المحمية.'],

{id:'machaerus',ar:'قلعة مكاور',en:'Machaerus (Mukawir)',region:'central',cat:'castle',art:'castle',ll:[31.5695,35.6358],gov:'محافظة مادبا',near:'قرية مكاور، فوق البحر الميت',

 about:['بنى الملك هيرودس الكبير القلعة والقصر على قمة معزولة لحماية الحدود، وتذكر الروايات التاريخية أن يوحنا المعمدان سُجن فيها. وهدمها الرومان في القرن الأول الميلادي.','من القمة تنفتح مياه البحر الميت وجباله في أحد أجمل مشاهد المملكة.'],

 about:['يمتد وادي رم بين جبال من الحجر الرملي والجرانيت وأودية رملية متسعة، وقد أُدرج في قائمة التراث العالمي لليونسكو. وارتبط بالثورة العربية الكبرى وبحياة البدو.','يحتضن نقوشًا وكتابات صخرية قديمة، ويتيح تجارب ليلية تحت سماء صافية.'],

function pointInPoly(lat,lng,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];
    if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lerpPath(path,t){
  let tot=0;const seg=[];
  for(let i=1;i<path.length;i++){const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);seg.push(d);tot+=d}
  let x=t*tot;
  for(let i=0;i<seg.length;i++){
    if(x<=seg[i]){const k=x/seg[i];return [path[i][0]+(path[i+1][0]-path[i][0])*k,path[i][1]+(path[i+1][1]-path[i][1])*k,path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]]}
    x-=seg[i];
  }
  const l=path[path.length-1];return [l[0],l[1],0,0];
}
function haversine(a,b){
  const R=6371,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLng=(b[1]-a[1])*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ---------- generative placeholder art (photo slots) ---------- */
function art(kind,seed,tag){
  const r=mulberry(seed*7919+13),W=1000,H=700;
  const sky=['#45050c','#5a0a0b','#720e07'];let o='';
  o+=`<defs><linearGradient id="g${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45050c"/><stop offset=".62" stop-color="#8b6220"/><stop offset="1" stop-color="#d5ac4e"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${seed})"/>`;
  o+=`<circle cx="${180+r()*620}" cy="${130+r()*90}" r="${46+r()*20}" fill="#eecf6d" opacity=".92"/>`;
  const ridge=(y,amp,fill,op,n)=>{let p=`M0 ${H}L0 ${y}`;for(let i=1;i<=n;i++)p+=`L${i*W/n} ${y-r()*amp}`;return `<path d="${p}L${W} ${H}Z" fill="${fill}" opacity="${op}"/>`};
  if(kind==='columns'){o+=ridge(480,70,'#8b6220',.7,9);for(let i=0;i<7;i++){const x=120+i*125,h=170+r()*30;o+=`<rect x="${x}" y="${520-h}" width="38" height="${h}" fill="#eecf6d" opacity=".92"/><rect x="${x-8}" y="${512-h}" width="54" height="12" fill="#eecf6d"/>`}o+=`<rect x="60" y="520" width="880" height="14" fill="#eecf6d"/>`+ridge(580,20,'#45050c',1,14)}
  else if(kind==='castle'){o+=ridge(470,110,'#8b6220',.8,7);const b=[[330,360,90],[420,320,110],[530,350,80],[610,380,70]];b.forEach(([x,y,w])=>{o+=`<rect x="${x}" y="${y}" width="${w}" height="${540-y}" fill="#d5ac4e"/>`;for(let k=0;k<4;k++)o+=`<rect x="${x+k*w/4}" y="${y-14}" width="${w/8}" height="14" fill="#d5ac4e"/>`});o+=`<path d="M470 540v-60q16-24 32 0v60z" fill="#45050c"/>`+ridge(590,30,'#45050c',1,11)}
  else if(kind==='cliffs'){o+=`<path d="M0 700V260L170 300L230 180L360 290L450 160L560 300L700 200L820 320L1000 260V700Z" fill="#720e07"/>`;o+=`<path d="M380 700V330h240v370z" fill="#d5ac4e"/><path d="M420 700V380h160v320z" fill="#eecf6d"/><path d="M470 700V520q30-34 60 0v180z" fill="#45050c"/>`;for(let i=0;i<5;i++)o+=`<rect x="${435+i*28}" y="390" width="10" height="110" fill="#d5ac4e"/>`}
  else if(kind==='dunes'){o+=ridge(420,50,'#8b6220',.7,6);o+=`<path d="M0 520Q250 380 500 500T1000 450V700H0Z" fill="#d5ac4e"/><path d="M0 590Q300 480 600 580T1000 540V700H0Z" fill="#eecf6d" opacity=".9"/>`;for(let i=0;i<3;i++){const x=150+i*300+r()*40;o+=`<path d="M${x} 400v-120q40-60 80 0v120z" fill="#45050c" opacity=".85"/>`}}
  else if(kind==='sea'){o+=ridge(380,40,'#8b6220',.75,7);o+=`<rect y="400" width="1000" height="300" fill="#45050c"/>`;for(let i=0;i<9;i++)o+=`<path d="M${r()*700} ${440+i*28}h${120+r()*160}" stroke="#d5ac4e" stroke-width="3" opacity=".6"/>`}
  else if(kind==='forest'){o+=ridge(430,80,'#8b6220',.7,8);for(let i=0;i<16;i++){const x=40+i*60+r()*20,s=1+r()*.6;o+=`<path d="M${x} 600l${-26*s} 0l${26*s} ${-92*s}l${26*s} ${92*s}z" fill="#45050c" opacity="${.7+r()*.3}"/>`}}
  else if(kind==='canyon'){o+=`<path d="M0 260L260 240L420 520L500 700H0Z" fill="#720e07"/><path d="M1000 240L720 260L580 540L500 700H1000Z" fill="#8b6220"/><path d="M420 520Q500 580 580 540L500 700Z" fill="#eecf6d" opacity=".8"/>`}
  else if(kind==='theatre'){o+=ridge(450,60,'#8b6220',.7,8);for(let i=0;i<8;i++){o+=`<path d="M${150+i*18} ${300+i*34}Q500 ${230+i*34} ${850-i*18} ${300+i*34}" stroke="#eecf6d" stroke-width="12" fill="none" opacity="${.95-i*.06}"/>`}o+=`<rect x="380" y="590" width="240" height="30" fill="#d5ac4e"/>`}
  else if(kind==='mosaic'){const c=['#eecf6d','#d5ac4e','#720e07','#45050c','#8b6220'];for(let y=0;y<14;y++)for(let x=0;x<20;x++){o+=`<rect x="${x*50}" y="${y*50}" width="48" height="48" fill="${c[Math.floor(r()*5)]}" opacity="${.6+r()*.4}"/>`}o+=`<circle cx="500" cy="350" r="150" fill="#45050c" opacity=".88"/><circle cx="500" cy="350" r="104" fill="none" stroke="#eecf6d" stroke-width="8"/>`}
  else if(kind==='dome'){o+=ridge(500,90,'#8b6220',.75,7);o+=`<path d="M400 520V430q100-150 200 0v90z" fill="#f6efdc"/><rect x="494" y="270" width="12" height="40" fill="#f6efdc"/>`+ridge(590,24,'#45050c',1,12)}
  else if(kind==='springs'){o+=ridge(430,70,'#8b6220',.7,8);for(let i=0;i<4;i++)o+=`<ellipse cx="${300+i*130}" cy="${560+(i%2)*20}" rx="${70-i*6}" ry="20" fill="#eecf6d" opacity=".8"/>`;for(let i=0;i<10;i++)o+=`<path d="M${280+r()*440} ${540-r()*10}q10 -40 0 -80" stroke="#f6efdc" stroke-width="3" fill="none" opacity=".5"/>`}
  else if(kind==='blocks'){o+=ridge(470,80,'#8b6220',.7,8);for(let i=0;i<3;i++)for(let j=0;j<5-i;j++)o+=`<rect x="${260+j*92+i*46}" y="${460-i*62}" width="88" height="58" fill="#eecf6d" stroke="#8b6220" stroke-width="3" opacity="${.85+.1*r()}"/>`}

}

/* ---------- locator mini map ---------- */
function locator(d){
  const x0=34.8,x1=39.4,y0=29.1,y1=33.5,W=300,H=Math.round(W*(y1-y0)/(x1-x0)*1.18);
  const px=lng=>((lng-x0)/(x1-x0))*W, py=lat=>H-((lat-y0)/(y1-y0))*H;
  const pts=JORDAN.map(p=>px(p[1]).toFixed(1)+','+py(p[0]).toFixed(1)).join(' ');
  const dot=DEST.map(o=>o.id===d.id?'':`<rect x="${px(o.ll[1])-3}" y="${py(o.ll[0])-3}" width="6" height="6" fill="#8b6220" transform="rotate(45 ${px(o.ll[1])} ${py(o.ll[0])})"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect width="${W}" height="${H}" fill="#efe5c8"/><polygon points="${pts}" fill="#e2d3ac" stroke="#8b6220" stroke-width="1.5"/>${dot}<g transform="translate(${px(d.ll[1])} ${py(d.ll[0])})"><circle r="11" fill="#720e07" opacity=".25"/><rect x="-6" y="-6" width="12" height="12" fill="#720e07" stroke="#eecf6d" stroke-width="2" transform="rotate(45)"/></g></svg>`;
}

<div><dt>${t('f_hours')}</dt><dd class="todo">${t('todo')}</dd></div>
<div><dt>${t('f_fee')}</dt><dd class="todo">${t('todo')}</dd></div></dl>
<div class="locator">${locator(d)}<small>${t('loc_cap',{n:esc(nm(d))})}</small></div></aside></div>
<section class="d-explore" id="explore-${d.id}"><div class="wrap"><h2 class="sec">${t('explore_h')}</h2><div class="ex-grid">${d.explore.map(e=>`<article class="ex"><h3>${esc(e[0])}</h3><p>${esc(e[1])}</p></article>`).join('')}</div></div></section>
<section class="d-related"><div class="wrap"><h2 class="sec">${t('related_h')}</h2><div class="rel-grid">${rel.map(({o,km})=>`<a class="rel" href="#d-${o.id}"><div class="rel-art">${art(o.art,o.n)}</div><div class="rel-t"><b>${esc(nm(o))}</b><span class="${subCls()}">${esc(sub(o))}</span><small>${cat(o.cat)} · ${t('away',{k:num(Math.round(km))})}</small></div></a>`).join('')}</div>
<div style="margin-top:34px"><a class="btn btn-ghost" href="#map">${ICON.arrow}${t('back')}</a></div></div></section></main>${footer()}</div>`;
}
function viewAbout(){return `<div class="page"><header class="wrap a-hero">${crumbs([[t('crumb_home'),'#map'],[t('crumb_about')]])}
<h1>${t('a_h1a')}<em>${t('a_h1b')}</em>${t('a_h1c')}</h1><p class="lead">${t('a_lead')}</p></header>
<div class="a-art">${art('cliffs',31,'')}</div>
<main class="grow"><section class="a-sec wrap"><div class="a-two"><div><h3>${t('a_vis')}</h3><p>${t('a_vis_p')}</p></div><div><h3>${t('a_mis')}</h3><p>${t('a_mis_p')}</p></div></div></section>
<section class="a-sec a-how"><div class="wrap"><h2 class="sec">${t('a_why')}</h2><div class="pillars"><div class="pil"><h3>${t('p1')}</h3><p>${t('p1p')}</p></div><div class="pil"><h3>${t('p2')}</h3><p>${t('p2p')}</p></div><div class="pil"><h3>${t('p3')}</h3><p>${t('p3p')}</p></div></div></div></section>
<section class="a-sec wrap"><h2 class="sec">${t('a_how')}</h2><ol class="how"><li><b>${t('s1')}</b>${t('s1p')}</li><li><b>${t('s2')}</b>${t('s2p')}</li><li><b>${t('s3')}</b>${t('s3p')}</li></ol>
<div class="ph"><b>${t('ph_t')}</b><p>${t('ph_p')}</p></div></section></main>${footer()}</div>`}

/* ---------- shell ---------- */
const root=document.getElementById('app');
let shell,stage,mapObj=null,mapEl=null,selId=null,markers={};
const $id=i=>document.getElementById(i);
function setNav(k){document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===k;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')})}
function closeDrawer(){shell&&shell.classList.remove('open')}
function openLogin(){closeDrawer();$id('modal').hidden=false;$id('fmsg').textContent='';setTimeout(()=>$id('em').focus(),20)}
function closeLogin(){$id('modal').hidden=true}
function toggleHelp(f){const hp=$id('help'),hb=$id('help-btn');const on=typeof f==='boolean'?f:hp.hidden;hp.hidden=!on;hb.setAttribute('aria-expanded',String(on));if(on)$id('help-x').focus()}

function mount(){
  const collapsed=shell?shell.classList.contains('collapsed'):false;
  root.innerHTML=`<div class="shell${collapsed?' collapsed':''}" id="shell"><div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="${t('side_aria')}"><button class="drawer-close" id="dclose" aria-label="${t('menu_close')}">${ICON.x}</button>
<div class="logo-box"><img src="${LOGO}" alt="${t('logo_alt')}" width="1154" height="912"></div>
<nav class="side-nav"><a class="nav-item" data-nav="map" href="#map" title="${t('nav_home')}">${ICON.home}<span>${t('nav_home')}</span></a><a class="nav-item" data-nav="about" href="#about" title="${t('nav_about')}">${ICON.info}<span>${t('nav_about')}</span></a><button type="button" class="nav-item" id="login-open" title="${t('nav_login')}">${ICON.user}<span>${t('nav_login')}</span></button><button type="button" class="nav-item" id="lang-sw" title="${t('lang_title')}">${ICON.globe}<span>${t('lang_btn')}</span></button></nav>
<div class="side-foot"><button type="button" class="collapse-btn" id="collapse" aria-expanded="${!collapsed}" aria-label="${collapsed?t('expand'):t('collapse')}">${ICON.chev}<span>${t('collapse')}</span></button></div></aside>
<button class="menu-btn" id="menu" aria-label="${t('menu_open')}">${ICON.menu}</button>
<div class="stage is-map" id="stage"></div></div>
<button class="help-btn" id="help-btn" aria-label="${t('help')}" aria-expanded="false" aria-controls="help">?</button>
<section class="help-panel" id="help" role="dialog" aria-label="${t('help_title')}" hidden><button class="help-x" id="help-x" aria-label="${t('help_close')}">${ICON.x}</button><h2>${t('help_title')}</h2><ol class="help-steps">
${[1,2,3,4].map(i=>`<li><div><b>${t('h'+i+'t')}</b>${t('h'+i)}</div></li>`).join('')}</ol></section>
<div class="modal" id="modal" hidden><form class="modal-card" id="login" role="dialog" aria-modal="true" aria-labelledby="lt" novalidate><button type="button" class="help-x" id="login-x" aria-label="${t('close')}">${ICON.x}</button>
<h2 id="lt">${t('login_title')}</h2><p class="sub">${t('login_sub')}</p>
<div class="field"><label for="em">${t('email')}</label><input id="em" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="field"><label for="pw">${t('password')}</label><input id="pw" type="password" autocomplete="current-password"></div>
<div class="form-msg" id="fmsg" role="status"></div>
<button class="btn btn-gold btn-block" type="submit">${t('login_btn')}</button>
<button class="btn btn-block" type="button" id="login-back" style="margin-top:10px;background:transparent;border-color:var(--bronze);color:var(--paper)">${t('cont')}</button></form></div>`;
  shell=$id('shell');stage=$id('stage');mapObj=null;mapEl=null;markers={};selId=null;
  $id('menu').onclick=()=>shell.classList.add('open');
  $id('scrim').onclick=closeDrawer;$id('dclose').onclick=closeDrawer;
  $id('collapse').onclick=()=>{const c=shell.classList.toggle('collapsed');$id('collapse').setAttribute('aria-expanded',String(!c));$id('collapse').setAttribute('aria-label',c?t('expand'):t('collapse'));setTimeout(()=>{mapObj&&mapObj.invalidateSize()},320)};
  $id('help-btn').onclick=()=>toggleHelp();$id('help-x').onclick=()=>{toggleHelp(false);$id('help-btn').focus()};
  $id('login-open').onclick=openLogin;$id('login-x').onclick=closeLogin;$id('login-back').onclick=closeLogin;
  $id('lang-sw').onclick=()=>setLang(LANG==='ar'?'en':'ar');
  $id('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeLogin()});
  $id('login').addEventListener('submit',e=>{e.preventDefault();const em=$id('em').value.trim(),pw=$id('pw').value;
    if(!/^\S+@\S+\.\S+$/.test(em)){$id('fmsg').textContent=t('err_email');$id('em').focus();return}
    if(!pw){$id('fmsg').textContent=t('err_pw');$id('pw').focus();return}
    $id('fmsg').textContent=t('demo')});
  document.querySelectorAll('.side a').forEach(a=>a.addEventListener('click',closeDrawer));
}

function route(){
  closeDrawer();
  const h=(location.hash||'#map').slice(1);
  if(h.startsWith('explore-'))return;
  if(h.startsWith('d-')){
    const d=DEST.find(x=>x.id===h.slice(2));
    if(d){showPage(viewDest(d.id));setNav('map');document.title='ATHAR | '+nm(d);return}
  }
  if(h==='about'){showPage(viewAbout());setNav('about');document.title=t('title_about');return}
  showMap();setNav('map');document.title=t('title_home');
}
function showPage(html){
  if(mapEl)mapEl.style.display='none';
  stage.classList.remove('is-map');
  Array.from(stage.children).forEach(c=>{if(c!==mapEl)c.remove()});
  stage.insertAdjacentHTML('beforeend',html);stage.scrollTop=0;
  stage.querySelector('[data-scroll]')?.addEventListener('click',e=>{e.preventDefault();stage.querySelector('.d-explore').scrollIntoView({behavior:'smooth',block:'start'})});
  stage.querySelectorAll('[data-login]').forEach(b=>b.addEventListener('click',openLogin));
}
function showMap(){
  Array.from(stage.children).forEach(c=>{if(c!==mapEl)c.remove()});
  stage.classList.add('is-map');
  if(!mapEl)buildMap();else{mapEl.style.display='';setTimeout(()=>mapObj.invalidateSize(),50)}
}
function buildMap(){
  mapEl=document.createElement('div');mapEl.className='view-map';
  mapEl.innerHTML=`<div id="map" role="region" aria-label="${t('map_aria')}"></div>
<div class="mc mc-tl"><button type="button" id="zin" aria-label="${t('zin')}">${ICON.plus}</button><button type="button" id="zout" aria-label="${t('zout')}">${ICON.minus}</button><button type="button" id="zhome" aria-label="${t('zhome')}">${ICON.full}</button></div>
<div class="plate"><b>${t('plate_b')}</b><span class="${LANG==='ar'?'en':'ar-s'}">${t('plate_s')}</span></div>
<div class="legend"><h3>${t('legend')}</h3><ul>${Object.keys(CATS).map(k=>`<li><span class="lg-d"><i></i></span>${cat(k)}</li>`).join('')}</ul><div class="scale"><span class="scale-bar" id="sbar"></span><span id="slab"></span></div></div>
<svg class="compass" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="rgba(246,239,220,.85)" stroke="#8b6220"/><path d="M32 8l7 24-7-4-7 4z" fill="#720e07"/><path d="M32 56l-7-24 7 4 7-4z" fill="#8b6220" opacity=".5"/><text x="32" y="7" text-anchor="middle" font-size="9" fill="#45050c" font-family="Times New Roman">N</text></svg>
<div class="peek" id="peek"><div class="peek-t"><b id="pk-n"></b><small id="pk-c"></small></div><a class="btn" id="pk-go" href="#">${t('peek_open')}</a></div>`;
  stage.appendChild(mapEl);
  const M=L.map('map',{zoomControl:false,attributionControl:false,minZoom:6,maxZoom:12,zoomSnap:.25,zoomDelta:.5,maxBounds:[[26.2,32.0],[35.8,42.5]],maxBoundsViscosity:.7});
  mapObj=M;
  const bounds=L.latLngBounds(JORDAN);
  const home=()=>M.fitBounds(bounds,{paddingTopLeft:[40,70],paddingBottomRight:[40,50],animate:true});
  M.setView([31.2,36.9],7);home();
  const seaStyle={fillColor:'#b8c8c1',fillOpacity:1,color:'#6f8b87',weight:1.2,interactive:false};
  L.polygon(MED,seaStyle).addTo(M);L.polygon(GULF,seaStyle).addTo(M);
  L.polygon([[28.5,34.48],[27,34.0],[27,36.2],[28.5,34.78]],seaStyle).addTo(M);
  M.createPane('land');M.getPane('land').style.zIndex=300;
  L.polygon(JORDAN,{pane:'land',fillColor:'#efdfa9',fillOpacity:1,color:'#45050c',weight:2.4,interactive:false}).addTo(M);
  L.polygon(JORDAN,{pane:'land',fill:false,color:'#d5ac4e',weight:6,opacity:.35,interactive:false}).addTo(M);
  L.polygon(HIGHLAND.concat(HIGHLAND.slice().reverse().map(p=>[p[0],p[1]+.42])),{fillColor:'#d5ac4e',fillOpacity:.35,weight:0,interactive:false}).addTo(M);
  L.polygon(DEADSEA,Object.assign({},seaStyle,{weight:1.4})).addTo(M);
  L.polygon(GALILEE,seaStyle).addTo(M);
  Object.values(RIVERS).forEach(r=>L.polyline(r,{color:'#6f8b87',weight:1.6,opacity:.9,interactive:false}).addTo(M));
  const rr=mulberry(77);
  for(let i=0;i<70;i++){const p=lerpPath(HIGHLAND,i/69);
    L.marker([p[0]+(rr()-.5)*.08,p[1]+.16+rr()*.3],{interactive:false,icon:L.divIcon({className:'',iconSize:[18,12],html:'<svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11L9 1l8 10" fill="none" stroke="#8b6220" stroke-width="1.4" opacity=".7"/></svg>'})}).addTo(M)}
  for(let i=0;i<46;i++){const lat=29.4+rr()*2.8,lng=36.5+rr()*2.4;if(!pointInPoly(lat,lng,JORDAN))continue;
    L.marker([lat,lng],{interactive:false,icon:L.divIcon({className:'',iconSize:[10,6],html:'<svg width="10" height="6"><path d="M0 4q2-3 5 0t5 0" fill="none" stroke="#b58c3a" stroke-width="1" opacity=".7"/></svg>'})}).addTo(M)}
  LABELS.forEach(l=>L.marker(l.ll,{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="lb ${l.c}">${lbl(l.t)}</div>`})}).addTo(M));
  L.marker([31.0,36.9],{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="lb lb-jo">${t('jordan_lbl')}<small>${t('jordan_sub')}</small></div>`})}).addTo(M);
  CITIES.forEach(c=>L.marker(c.ll,{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="lb lb-city lb-feat" style="font-style:normal;color:#2b1812">${lbl(c.ar)}</div>`})}).addTo(M));
  const peek=$id('peek');
  function select(id){
    if(selId&&markers[selId])markers[selId].el()?.classList.remove('sel');
    selId=id;const d=DEST.find(x=>x.id===id);markers[id].el()?.classList.add('sel');
    $id('pk-n').textContent=nm(d);$id('pk-c').textContent=cat(d.cat)+' · '+reg(d.region);$id('pk-go').href='#d-'+id;peek.classList.add('on');
  }
  DEST.forEach(d=>{
    const ic=L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:`<div class="mk" tabindex="0" role="link" aria-label="${esc(nm(d))}, ${cat(d.cat)}"><i class="mk-d"></i>${CI[d.cat]}</div>`});
    const m=L.marker(d.ll,{icon:ic,keyboard:false,riseOnHover:true}).addTo(M);
    m.bindTooltip(`${esc(nm(d))}<span class="${subCls()}">${esc(sub(d))}</span>`,{direction:'top',offset:[0,-18],className:'mk-tip',opacity:1});
    const el=()=>m.getElement()&&m.getElement().querySelector('.mk');
    markers[d.id]={m,el};
    const open=()=>{location.hash='d-'+d.id};
    m.on('click',()=>{if(matchMedia('(hover:none)').matches&&selId!==d.id){select(d.id);return}open()});
    const e=el();if(e){e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});e.addEventListener('focus',()=>select(d.id))}
  });
  M.on('click',()=>{peek.classList.remove('on');if(selId&&markers[selId])markers[selId].el()?.classList.remove('sel');selId=null});
  $id('zin').onclick=()=>M.zoomIn();$id('zout').onclick=()=>M.zoomOut();$id('zhome').onclick=home;
  const upd=()=>{
    mapEl.classList.toggle('nofeat',M.getZoom()<7.25);
    const c=M.getCenter(),p1=M.latLngToContainerPoint(c),p2=L.point(p1.x+80,p1.y),km=M.containerPointToLatLng(p1).distanceTo(M.containerPointToLatLng(p2))/1000;
    const nice=[1,2,5,10,20,25,50,100,200].reduce((a,b)=>Math.abs(b-km)<Math.abs(a-km)?b:a);
    $id('sbar').style.width=(80*nice/km)+'px';$id('slab').textContent=num(nice)+' '+t('km');
  };
  M.on('zoom move',upd);upd();
}

/* ---------- language ---------- */
function applyLangAttrs(){const h=document.documentElement;h.setAttribute('lang',LANG);h.setAttribute('dir',LANG==='ar'?'rtl':'ltr')}
function setLang(l){
  LANG=l;CHOSEN=true;try{localStorage.setItem('athar-lang',l)}catch(e){}
  applyLangAttrs();
  if(mapObj){try{mapObj.remove()}catch(e){}}
  mount();route();
}
function showGate(){
  const g=document.createElement('div');g.className='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','gt');
  g.innerHTML=`<div class="gate-in"><div class="logo-box"><img src="${LOGO}" alt="ATHAR أثر" width="1154" height="912"></div>
<h1 id="gt" class="gate-t"><span lang="ar" dir="rtl">اختر لغة التصفح</span><span lang="en" dir="ltr" class="en">Choose your language</span></h1>
<div class="gate-btns"><button type="button" class="btn btn-gold" id="g-ar" lang="ar">العربية</button><button type="button" class="btn btn-ghost-light" id="g-en" lang="en">English</button></div>
<p class="gate-note" lang="ar" dir="rtl">يمكنك تغيير اللغة لاحقًا من القائمة الجانبية.</p></div>`;
  document.body.appendChild(g);
  const pick=l=>{g.remove();setLang(l)};
  $id('g-ar').onclick=()=>pick('ar');$id('g-en').onclick=()=>pick('en');
  $id('g-ar').focus();
}

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const m=$id('modal'),hp=$id('help');if(m&&!m.hidden)closeLogin();else if(hp&&!hp.hidden){toggleHelp(false);$id('help-btn').focus()}else closeDrawer()});
window.addEventListener('hashchange',()=>{if(stage)route()});
window.addEventListener('resize',()=>{if(mapObj&&mapEl&&mapEl.style.display!=='none')mapObj.invalidateSize()});
applyLangAttrs();mount();route();
if(!CHOSEN)showGate();
})();

</script>
